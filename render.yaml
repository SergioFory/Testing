##
## render.yaml — Infraestructura del Sistema de Trading ML v5.0
##
## Servicios definidos:
##   trading-dashboard  → Web (Streamlit, accesible desde el browser)
##   trading-scheduler  → Worker en background (señales + reentrenamiento)
##
## Base de datos:
##   trading-db         → PostgreSQL gestionado por Render
##
## Primeros pasos en Render:
##   1. Conecta tu repo GitHub en render.com → New → Blueprint
##   2. Render detecta este archivo y crea todos los recursos automáticamente
##   3. Añade las variables secretas marcadas como "sync: false" en el dashboard
##

databases:
  - name: trading-db
    databaseName: trading
    user: trading_user
    plan: free               # Cambia a "starter" para persistencia duradera

services:
  # -------------------------------------------------------------------------
  # Dashboard Streamlit (interfaz web)
  # -------------------------------------------------------------------------
  - type: web
    name: trading-dashboard
    runtime: python
    plan: free               # free tier: 512 MB RAM, se duerme tras inactividad
    region: oregon           # Cambia según tu zona: oregon | frankfurt | singapore

    buildCommand: |
      pip install --upgrade pip
      pip install -r trading_system/requirements.txt

    startCommand: >
      streamlit run trading_system/dashboard/app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false

    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-db
          property: connectionString

      - key: PYTHONPATH
        value: /opt/render/project/src

      # --- Credenciales (añadir manualmente en el dashboard de Render) ---
      - key: BINANCE_API_KEY
        sync: false

      - key: BINANCE_API_SECRET
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: CRYPTOPANIC_API_KEY
        sync: false

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_CHAT_ID
        sync: false

  # -------------------------------------------------------------------------
  # Scheduler / Worker (daemon: señales + reentrenamiento)
  # -------------------------------------------------------------------------
  - type: worker
    name: trading-scheduler
    runtime: python
    plan: free

    buildCommand: |
      pip install --upgrade pip
      pip install -r trading_system/requirements.txt

    startCommand: >
      python trading_system/main.py schedule
      --interval 60
      --retrain-hour 03:00

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-db
          property: connectionString

      - key: PYTHONPATH
        value: /opt/render/project/src

      - key: BINANCE_API_KEY
        sync: false

      - key: BINANCE_API_SECRET
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: CRYPTOPANIC_API_KEY
        sync: false

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_CHAT_ID
        sync: false
