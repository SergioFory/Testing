services:
  # Dashboard Streamlit
  - type: web
    name: trading-dashboard
    runtime: python
    plan: starter
    region: frankfurt

    buildCommand: |
      pip install --upgrade pip
      pip install -r trading_system/requirements.txt

    startCommand: streamlit run trading_system/dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false

    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # Worker: entrena modelos al arrancar y luego corre el scheduler
  - type: worker
    name: trading-scheduler
    runtime: python
    plan: starter
    region: frankfurt

    buildCommand: |
      pip install --upgrade pip
      pip install -r trading_system/requirements.txt

    startCommand: python trading_system/main.py retrain --all --notify && python trading_system/main.py schedule --interval 60 --retrain-hour 03:00

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
