services:
  # Dashboard Streamlit
  - type: web
    name: trading-dashboard
    runtime: python
    plan: starter
    region: frankfurt

    buildCommand: |
      pip install --upgrade pip
      pip install -r trading_system/requirements.txt

    startCommand: streamlit run trading_system/dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false

    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      # Capital real de la cuenta en USD (tamaño y riesgo en % del mensaje).
      # Sin valor → 10000.
      - key: TRADING_CAPITAL
        sync: false

  # Worker: corre el scheduler (señales cada 60 min + tarea nocturna 03:00 UTC).
  # Fase 1: sin "retrain --all" al arrancar. El ML está apagado en todos los
  # activos (use_ml=False): reentrenar retrasaba la primera señal ~4-6 min tras
  # cada reinicio, gastaba RAM y enviaba alertas de "modelo actualizado" sin uso.
  - type: worker
    name: trading-scheduler
    runtime: python
    plan: starter
    region: frankfurt

    buildCommand: |
      pip install --upgrade pip
      pip install -r trading_system/requirements.txt

    startCommand: python trading_system/main.py schedule --interval 60 --retrain-hour 03:00

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      # Capital real de la cuenta en USD (tamaño y riesgo en % del mensaje).
      # Sin valor → 10000.
      - key: TRADING_CAPITAL
        sync: false
